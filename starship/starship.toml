"$schema" = 'https://starship.rs/config-schema.json'

# O PROMPT_COMMAND do .bashrc já imprime uma linha em branco antes do prompt
add_newline = false

# prompt numa linha só: caminho completo, git e o resto, sem o símbolo ❯
format = '${env_var.PROMPT_DIR}$all'

[line_break]
disabled = true

[character]
disabled = true

# o módulo directory abrevia o home para ~ e corta o caminho no repositório;
# o PROMPT_DIR vem do .bashrc: caminho inteiro sem o /home/mine, e some no home
[directory]
disabled = true

[env_var.PROMPT_DIR]
format = '[$env_value]($style) '
style = 'bold cyan'
