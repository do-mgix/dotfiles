# i3status configuration file.
# see "man i3status" for documentation.

# It is important that this file is edited as UTF-8.
# The following line should contain a sharp s:
# ß
# If the above line is not correctly displayed, fix your editor first!

general {
        # sem cores: tudo no branco padrão da barra
        colors = false
        interval = 5
}

# ícones da Hack Nerd Font (a fonte da barra) no lugar dos rótulos, sem '|' entre os blocos;
# separator = false tira a barra vertical e separator_block_width espalha os blocos.
# O dia da semana em duas letras (Su Mo ... Sa) é cortado pelo i3/scripts/i3status.sh

order += "wireless _first_"
order += "ethernet _first_"
order += "battery all"
order += "disk /"
order += "load"
order += "memory"
order += "tztime date"
order += "tztime time"

wireless _first_ {
        format_up = "󰖩 %essid %quality %ip"
        format_down = "󰖪 off"
        format_quality = "%d%s"
        separator = false
        separator_block_width = 40
}

ethernet _first_ {
        format_up = "󰈀 %ip"
        format_down = "󰈀 off"
        separator = false
        separator_block_width = 40
}

battery all {
        format = "%status %percentage"
        status_bat = "󰁹"
        status_chr = "󰂄"
        status_full = "󰁹"
        status_unk = "󰁹"
        integer_battery_capacity = true
        separator = false
        separator_block_width = 40
}

disk "/" {
        format = "󰋊 %avail"
        separator = false
        separator_block_width = 40
}

load {
        format = " %1min"
        separator = false
        separator_block_width = 40
}

memory {
        format = "󰍛 %percentage_used"
        separator = false
        separator_block_width = 40
}

tztime date {
        format = "%a %d/%m/%Y"
        separator = false
        separator_block_width = 40
}

tztime time {
        format = "%H:%M"
        separator = false
        separator_block_width = 20
}
