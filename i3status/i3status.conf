# i3status configuration file.
# see "man i3status" for documentation.

# It is important that this file is edited as UTF-8.
# The following line should contain a sharp s:
# ß
# If the above line is not correctly displayed, fix your editor first!

general {
        # sem cores: tudo no branco padrão da barra
        colors = false
        interval = 5
}

# rótulos em minúsculas, sem ':' '/' '()' ou '|' entre os blocos;
# separator = false tira a barra vertical e separator_block_width espalha os blocos

order += "wireless _first_"
order += "ethernet _first_"
order += "battery all"
order += "disk /"
order += "load"
order += "memory"
order += "tztime date"
order += "tztime time"

wireless _first_ {
        format_up = "wifi %essid %quality %ip"
        format_down = "wifi off"
        format_quality = "%d%s"
        separator = false
        separator_block_width = 40
}

ethernet _first_ {
        format_up = "eth %ip"
        format_down = "eth off"
        separator = false
        separator_block_width = 40
}

battery all {
        format = "%status %percentage"
        status_bat = "bat"
        status_chr = "carregando"
        status_full = "cheia"
        status_unk = "bat"
        integer_battery_capacity = true
        separator = false
        separator_block_width = 40
}

disk "/" {
        format = "disco %avail livre"
        separator = false
        separator_block_width = 40
}

load {
        format = "load %1min"
        separator = false
        separator_block_width = 40
}

memory {
        format = "ram %percentage_used"
        separator = false
        separator_block_width = 40
}

tztime date {
        format = "%d %m %Y"
        separator = false
        separator_block_width = 40
}

tztime time {
        format = "%Hh%M"
        separator = false
        separator_block_width = 20
}
